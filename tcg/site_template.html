<title>宮崎トレカ抽選帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: 駅の発車標。上に黒帯と「次の締切」、本体は締切時刻の時刻表、タブは画面下に固定 */
:root{
  --bg:#f4f4f0; --board:#ffffff; --row:#f8f8f4; --band:#16181b; --band-ink:#f2f2ee;
  --ink:#16181b; --sub:#5f6670; --line:#dcdcd4;
  --amber:#a86400; --amber-band:#ffb000; --amber-soft:#fff1d1;
  --green:#1d7a46; --green-soft:#dff3e6; --red:#b8321f; --red-soft:#fbe4df;
  --violet:#5b55a8; --violet-soft:#ebeaf8; --done:#7b8592; --done-soft:#ececea;
  --f-ui:"BIZ UDGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",monospace;
  --barh:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101214; --board:#16191c; --row:#1b1f23; --band:#000000; --band-ink:#f2f2ee;
  --ink:#f2f2ee; --sub:#8d949c; --line:#262a30;
  --amber:#ffb000; --amber-band:#ffb000; --amber-soft:#3a2a05;
  --green:#56d38a; --green-soft:#12301f; --red:#ff6b5a; --red-soft:#3d1a15;
  --violet:#a9a3f2; --violet-soft:#25233f; --done:#8a96a3; --done-soft:#22272d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101214; --board:#16191c; --row:#1b1f23; --band:#000000; --band-ink:#f2f2ee;
  --ink:#f2f2ee; --sub:#8d949c; --line:#262a30;
  --amber:#ffb000; --amber-band:#ffb000; --amber-soft:#3a2a05;
  --green:#56d38a; --green-soft:#12301f; --red:#ff6b5a; --red-soft:#3d1a15;
  --violet:#a9a3f2; --violet-soft:#25233f; --done:#8a96a3; --done-soft:#22272d; color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;padding-block:0 calc(var(--barh) + env(safe-area-inset-bottom,0px) + 24px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
a{color:var(--amber)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--sub)} .small{font-size:12.5px}
h1,h2{margin:0;text-wrap:balance}
/* 上の黒帯 */
.band{background:var(--band);color:var(--band-ink);border-bottom:3px solid var(--amber-band)}
.band .in{padding-block:16px 12px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.band h1{font-size:19px;font-weight:700;letter-spacing:.08em}
.band .now{font-family:var(--f-mono);color:var(--amber-band);font-size:12px}
/* 次の締切 */
.main{display:flex;flex-direction:column;gap:18px;padding-block:14px}
.next{border:1.5px solid var(--amber);border-radius:6px;padding:10px 12px;background:var(--board);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.next .l{font-size:11px;color:var(--amber);letter-spacing:.12em;font-weight:700}
.next .big{font-family:var(--f-mono);font-size:32px;font-weight:700;color:var(--amber);line-height:1.05}
.next .big small{font-size:14px;margin-left:8px}
.next .w{font-size:13.5px;font-weight:700;grid-column:1/-1;overflow-wrap:anywhere}
.next .cd{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--red);text-align:right}
.next.none .big{font-size:18px}
.counts{display:flex;gap:16px;font-size:12px;color:var(--sub)}
.counts b{font-family:var(--f-mono);font-size:16px;color:var(--ink);margin-right:3px}
.counts .hot b{color:var(--red)}
/* 絞り込み */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select,.filters label{flex:none;font:inherit;font-size:13px}
.filters select{background:var(--board);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.filters label{display:flex;align-items:center;gap:4px;color:var(--sub);padding:0 4px}
/* 時刻表 */
section.group{display:flex;flex-direction:column;min-width:0}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px 6px;border-bottom:2px solid var(--ink)}
.ghead h2{font-size:14px;letter-spacing:.1em}
.ghead .count{font-family:var(--f-mono);font-size:12px;color:var(--sub)}
.cap{display:grid;grid-template-columns:64px minmax(0,1fr) 62px;gap:8px;padding:5px 10px;font-size:10.5px;color:var(--sub);letter-spacing:.1em;border-bottom:1px solid var(--line)}
.board{background:var(--board);border:1px solid var(--line);border-top:0}
details.rw{border-bottom:1px solid var(--line)}
details.rw:nth-child(even){background:var(--row)}
details.rw>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr) 62px;gap:8px;padding:10px;align-items:start}
details.rw>summary::-webkit-details-marker{display:none}
details.rw.closed{opacity:.55}
.tm{font-family:var(--f-mono);font-weight:700;font-size:16px;color:var(--amber);line-height:1.15}
.tm small{display:block;font-size:10.5px;color:var(--sub);font-weight:500;margin-top:2px}
.tm.plain{color:var(--ink)}
.wh{min-width:0}
.wh b{display:block;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.wh .p{display:block;font-size:12.5px;color:var(--sub);line-height:1.45;overflow-wrap:anywhere}
.wh .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:0 5px;white-space:nowrap}
.tag.mine{border-color:var(--violet);color:var(--violet)}
.tag.warn{border-color:var(--amber);color:var(--amber)}
.tag.new{border-color:var(--green);color:var(--green)}
.stt{font-size:11px;font-weight:700;text-align:center;border-radius:3px;padding:3px 0;line-height:1.2}
.stt small{display:block;font-family:var(--f-mono);font-size:10px;font-weight:500;margin-top:2px}
.st-open{background:var(--green-soft);color:var(--green)}
.st-soon{background:var(--red);color:var(--board)}
.st-wait{background:var(--violet-soft);color:var(--violet)}
.st-done{background:var(--done-soft);color:var(--done)}
.st-warn,.st-unv{border:1px solid var(--amber);color:var(--amber)}
.st-ok{background:var(--green-soft);color:var(--green)}
.det{padding:0 10px 12px calc(10px + 64px + 8px);display:flex;flex-direction:column;gap:8px;font-size:13px}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.det dt{color:var(--sub)} .det dd{margin:0;min-width:0;overflow-wrap:anywhere}
.det .note{color:var(--amber);font-size:12.5px}
.det .acts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.det .acts a{font-weight:700}
.marks{display:flex;gap:4px}
.marks button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:3px;padding:3px 9px;cursor:pointer}
.marks button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--board);font-weight:700}
.ap{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;padding:10px;align-items:start;border-bottom:1px solid var(--line)}
.ap .tm.late{color:var(--red)}
.ap .marks button{font-size:12px}
.mk{font-size:10px;font-weight:700;color:var(--amber)}
.hsum{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--sub)}
.hsum b{font-family:var(--f-mono);font-size:16px;color:var(--ink);margin-right:3px}
.hfilt{display:flex;flex-wrap:wrap;gap:6px}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:10px;border-bottom:1px solid var(--line);align-items:start}
.hrow .hh{min-width:0}
.hrow .hh b{display:block;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.hrow .hh .p{display:block;font-size:12.5px;color:var(--sub);line-height:1.45;overflow-wrap:anywhere}
.hrow .hh .late{color:var(--red);font-weight:700}
.hrow textarea.mem{grid-column:1/-1;font:inherit;font-size:16px;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 8px;resize:vertical}
.hrow .hacts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px}
.hrow.won{box-shadow:inset 3px 0 0 var(--green)}
.hrow.lost{box-shadow:inset 3px 0 0 var(--done)}
.hrow.applied{box-shadow:inset 3px 0 0 var(--amber)}
.empty{padding:14px 10px;color:var(--sub);font-size:13.5px;background:var(--board);border:1px solid var(--line);border-top:0}
.lead{margin:0;font-size:12.5px;color:var(--sub)}
.dbnote{font-size:12px;color:var(--sub);margin:0}
/* 店リスト */
.panel{background:var(--board);border:1px solid var(--line);border-top:0}
.store{display:flex;flex-direction:column;gap:3px;padding:9px 10px;border-bottom:1px solid var(--line)}
.store:last-child{border-bottom:0}
.store .nm{font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;border-radius:3px;padding:0 6px;background:var(--amber-soft);color:var(--amber);font-weight:700}
.pill{font-size:11px;font-weight:700;border-radius:3px;padding:1px 7px;white-space:nowrap}
.pill.mine{background:var(--violet-soft);color:var(--violet)}
.cityh{font-size:13px;letter-spacing:.08em;padding:12px 2px 6px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-size:12.5px;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:400;white-space:nowrap}
/* 追加フォーム */
.form{display:flex;flex-direction:column;gap:12px;padding:12px;background:var(--board);border:1px solid var(--line)}
.form label,.form .lbl,.form legend{font-size:12.5px;color:var(--sub)}
.form input,.form select,.form textarea{font:inherit;font-size:16px;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px 10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field.two>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.seg{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.seg legend{width:100%;margin-bottom:4px}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;padding:7px 12px;color:var(--ink);font-size:14px;cursor:pointer}
.seg label:has(input:checked){border-color:var(--amber);background:var(--amber-soft);color:var(--amber);font-weight:700}
.seg input,.checks input{width:auto;accent-color:var(--amber)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:4px;color:var(--ink);font-size:14px;border:1px solid var(--line);border-radius:4px;padding:4px 8px}
button.primary{font:inherit;font-weight:700;background:var(--amber);color:var(--board);border:0;border-radius:4px;padding:11px 18px;cursor:pointer}
button.primary:disabled{opacity:.5;cursor:default}
details.ed{margin-top:4px}
details.ed>summary{cursor:pointer;font-size:12px;color:var(--sub);list-style:none;display:inline-block;border:1px solid var(--line);border-radius:3px;padding:1px 8px}
details.ed>summary::-webkit-details-marker{display:none}
details.ed[open]>summary{color:var(--amber);border-color:var(--amber)}
.ed-body{display:flex;flex-direction:column;gap:8px;padding:8px 0 2px}
.ed-body .checks label{font-size:13px;color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:3px 8px;display:flex;gap:4px;align-items:center}
.ed-body input{accent-color:var(--amber)}
button.primary.sm{padding:6px 14px;font-size:13px}
.chip.mine-chip{background:var(--violet-soft);color:var(--violet)}
button.link.restore{color:var(--amber)}
button.regbtn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--board);color:var(--ink);border-radius:4px;padding:6px 12px;cursor:pointer}
button.regbtn[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--board);font-weight:700}
button.link{font:inherit;font-size:12px;background:none;border:0;color:var(--red);cursor:pointer;padding:0}
/* 下のタブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--band);border-top:1px solid #2c3036;
  display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{font:inherit;font-size:11px;background:none;border:0;color:#8d949c;padding:8px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:var(--barh);justify-content:center}
nav.tabs button b{font-family:var(--f-mono);font-size:17px;line-height:1.1}
nav.tabs button[aria-selected="true"]{color:var(--amber-band);box-shadow:inset 0 3px 0 var(--amber-band)}
nav.tabs .n{font-family:var(--f-mono);font-size:10px}
@media (min-width:720px){.next .big{font-size:38px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="band"><div class="in"><h1>宮崎トレカ抽選帳</h1><span class="now" id="built"></span></div></header>

<main class="in main">
  <div id="view-list" style="display:flex;flex-direction:column;gap:16px">
    <div id="next"></div>
    <div class="counts" id="today"></div>
    <div class="filters">
      <select id="f-card" aria-label="カード種"></select>
      <select id="f-type" aria-label="販売方法">
        <option value="">販売方法：すべて</option><option value="lottery">抽選</option><option value="first_come">先着</option><option value="restock">再販</option><option value="store">店頭</option>
      </select>
      <select id="f-pickup" aria-label="受取方法">
        <option value="">受取：すべて</option><option value="store">宮崎の店で受取</option><option value="online">配送</option>
      </select>
      <select id="f-city" aria-label="市町村"></select>
      <label><input type="checkbox" id="f-closed"> 終了も表示</label>
    </div>
    <section class="group" id="g-store"></section>
    <section class="group" id="g-online"></section>
    <section class="group" id="g-upcoming"></section>
    <section class="group" id="g-topps" hidden></section>
    <p class="dbnote" id="marks-note"></p>
  </div>

  <div id="view-hist" hidden style="display:flex;flex-direction:column;gap:12px">
    <p class="lead">「応募済み」を押した抽選の履歴です。結果が出たら当選・落選を選び、メモも残せます。メモは入力欄を離れると保存されます。</p>
    <div class="hsum" id="hist-sum"></div>
    <div class="hfilt" id="hist-filt"></div>
    <section class="group" id="hist-list"></section>
  </div>

  <div id="view-unv" hidden style="display:flex;flex-direction:column;gap:10px">
    <p class="lead">一次情報（店の公式ページ）で裏が取れていない情報です。締切の一覧には入れていません。気になるものは店の告知を自分で確認してください。</p>
    <section class="group" id="unv-list"></section>
  </div>

  <div id="view-stores" hidden style="display:flex;flex-direction:column;gap:16px">
    <p class="lead" id="stores-head"></p>
    <section class="group" id="my-stores"></section>
    <section class="group" id="online-shops"></section>
    <section class="group" id="topps-links"></section>
    <section class="group"><div class="ghead"><h2>宮崎県内の店</h2><span class="count" id="stores-n"></span></div><div id="stores-list"></div></section>
    <section class="group" id="hidden-stores"></section>
    <section class="group"><div class="ghead"><h2>チェーンの県内店舗</h2></div><div class="panel tablewrap"><table id="chains"></table></div></section>
  </div>

  <div id="view-add" hidden style="display:flex;flex-direction:column;gap:14px">
    <p class="lead">自分で見つけた店や抽選、店頭で見た在庫を登録できます。登録した内容はすぐ一覧に出て、次の定期収集で一次情報の確認もします。</p>
    <form id="add-form" class="form" novalidate>
      <fieldset class="seg" id="add-kind">
        <legend>何を追加しますか</legend>
        <label><input type="radio" name="kind" value="store" checked> 店</label>
        <label><input type="radio" name="kind" value="listing"> 抽選・販売</label>
        <label><input type="radio" name="kind" value="memo"> 店頭メモ</label>
      </fieldset>
      <div class="field" data-for="store listing memo"><label for="a-shop">店・サイトの名前</label><input id="a-shop" required placeholder="例：カードショップ○○ 宮崎店"></div>
      <div class="field" data-for="store"><label for="a-where">場所</label>
        <select id="a-where"><option value="miyazaki">宮崎県内の実店舗</option><option value="online">通販・全国</option></select></div>
      <div class="field" data-for="store"><label for="a-city">市町村</label><input id="a-city" list="city-list" placeholder="例：宮崎市"><datalist id="city-list"></datalist></div>
      <div class="field" data-for="store"><span class="lbl">扱っているカード</span><div class="checks" id="a-cards"></div></div>
      <div class="field" data-for="listing memo"><label for="a-card">カード</label><select id="a-card"></select></div>
      <div class="field" data-for="listing memo"><label for="a-product">商品名</label><input id="a-product" placeholder="例：神の支配【OP-18】BOX"></div>
      <div class="field" data-for="listing"><label for="a-type">販売方法</label>
        <select id="a-type"><option value="lottery">抽選</option><option value="first_come">先着</option><option value="restock">再販</option><option value="store">店頭販売</option></select></div>
      <div class="field" data-for="listing"><label for="a-pickup">受取</label>
        <select id="a-pickup"><option value="store">宮崎の店で受取</option><option value="online">配送</option></select></div>
      <div class="field two" data-for="listing"><div><label for="a-start">受付開始</label><input id="a-start" type="datetime-local"></div><div><label for="a-end">締切</label><input id="a-end" type="datetime-local"></div></div>
      <div class="field" data-for="listing"><label for="a-price">価格（税込・円）</label><input id="a-price" type="number" inputmode="numeric" min="0" placeholder="例：5760"></div>
      <div class="field" data-for="memo"><label for="a-seen">見た日時</label><input id="a-seen" type="datetime-local"></div>
      <div class="field" data-for="store listing memo"><label for="a-url">URL（公式ページ・告知。あれば）</label><input id="a-url" type="url" inputmode="url" placeholder="https://"></div>
      <div class="field" data-for="store listing memo"><label for="a-note">メモ（応募条件・在庫の様子など）</label><textarea id="a-note" rows="3"></textarea></div>
      <div class="row"><button type="submit" class="primary" id="a-submit">追加する</button><span class="small muted" id="a-msg" role="status"></span></div>
    </form>
    <section class="group" id="my-entries"></section>
  </div>


  <div id="view-log" hidden style="display:flex;flex-direction:column;gap:10px">
    <section class="group"><div class="ghead"><h2>更新記録</h2></div><div class="panel tablewrap"><table id="runs"></table></div></section>
  </div>
</main>

<nav class="tabs" role="tablist" aria-label="画面の切り替え">
  <button role="tab" id="tab-list" aria-selected="true" data-view="list"><b>◷</b>締切</button>
  <button role="tab" id="tab-hist" aria-selected="false" data-view="hist"><b>✓</b>履歴</button>
  <button role="tab" id="tab-unv" aria-selected="false" data-view="unv"><b>?</b><span>未確認 <span class="n" id="unv-n"></span></span></button>
  <button role="tab" id="tab-stores" aria-selected="false" data-view="stores"><b>⌂</b>店リスト</button>
  <button role="tab" id="tab-add" aria-selected="false" data-view="add"><b>＋</b>追加</button>
  <button role="tab" id="tab-log" aria-selected="false" data-view="log"><b>≡</b>記録</button>
</nav>

<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isForm = (u) => /docs\.google\.com\/forms|forms\.gle/.test(u || "");
const safeUrl = (u) => /^https?:\/\//.test(u || "") ? u : null;
const NOW = new Date();
const H = 3600e3;
const TYPE = {lottery:"抽選", first_come:"先着", restock:"再販", store:"店頭"};
const VERIFY = {ok:"一次情報と一致", mismatch:"要目視（自動照合で一致せず）", blocked:"自動確認不可", unreachable:"開けなかった"};

// 表示は常に日本時間
const JST_PARTS = new Intl.DateTimeFormat("ja-JP", {timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"});
const JPARTS = (s) => Object.fromEntries(JST_PARTS.formatToParts(new Date(s)).map((x) => [x.type, x.value]));
function fmt(s, withTime = true) {
  if (!s) return null;
  const p = Object.fromEntries(JST_PARTS.formatToParts(new Date(s)).map((x) => [x.type, x.value]));
  const md = `${p.month}/${p.day}(${p.weekday})`;
  return withTime ? `${md} ${p.hour}:${p.minute}` : md;
}
function fmtResult(s) {
  if (!s) return null;
  const p = JPARTS(s);
  return `${p.month}/${p.day}(${p.weekday})` + (p.hour === "00" && p.minute === "00" ? "" : ` ${p.hour}:${p.minute}`);
}
function ago(s) {
  const m = Math.round((NOW - new Date(s)) / 60000);
  if (m < 60) return `${Math.max(m, 0)}分前`;
  if (m < 48 * 60) return `${Math.round(m / 60)}時間前`;
  return `${Math.round(m / 1440)}日前`;
}
function left(s) {
  const ms = new Date(s) - NOW;
  if (ms <= 0) return "締切済み";
  const h = ms / H;
  if (h < 1) return `あと${Math.ceil(ms / 60000)}分`;
  if (h < 48) return `あと${Math.floor(h)}時間`;
  return `あと${Math.floor(h / 24)}日`;
}

// 状態をいまの時刻で計算し直す（受付中／まもなく締切／受付前／終了／要確認）
function stateOf(it) {
  const end = it.end_at ? new Date(it.end_at) : null;
  const start = it.start_at ? new Date(it.start_at) : null;
  if (it.status === "closed" || (end && end < NOW)) return {key: "done", label: "終了"};
  if (it.status === "sold_out") return {key: "done", label: "売り切れ"};
  if (it.status === "in_stock") return {key: "open", label: "販売中"};
  if (start && start > NOW) return {key: "wait", label: "受付前"};
  if (end && end - NOW < 48 * H) return {key: "soon", label: "締切間近"};
  if (it.status === "unknown") return {key: "warn", label: "状態不明"};
  return {key: "open", label: "受付中"};
}
function stale(it) {
  if (it.needs_check) return true;
  const age = NOW - new Date(it.last_checked_at);
  if (it.status === "in_stock" && it.pickup === "online") return age > 0.5 * H;
  if (["upcoming", "open", "in_stock"].includes(it.status)) return age > 24 * H;
  return false;
}

// ---- 応募記録（claude.ai のデータ保存。使えないときはこの端末だけに保存） ----
let marks = {};
let entries = [];          // 自分で追加した店・抽選・メモ
let entryStore = null;
const LS_ENTRIES = "tcg-entries";
try { entries = JSON.parse(localStorage.getItem(LS_ENTRIES) || "[]"); } catch (e) { entries = []; }
let markStore = null;
// 取扱店の手直し（カードの追加・削除、一覧から消す）。キーは m:宮崎の店 / o:通販の店 / t:Topps実績の店
let edits = {};
let editStore = null;
const LS_EDITS = "tcg-store-edits";
try { edits = JSON.parse(localStorage.getItem(LS_EDITS) || "{}"); } catch (e) { edits = {}; }
const editKey = (k) => k.replace(":", "__");          // DBの文書IDに使える形
function cardsOf(key, base) {
  const e = edits[key] || {};
  const set = new Set(base || []);
  (e.add || []).forEach((c) => set.add(c));
  (e.remove || []).forEach((c) => set.delete(c));
  return Object.keys(DATA.card_names).filter((c) => set.has(c));
}
const isHidden = (key) => !!(edits[key] && edits[key].hidden);
function chipsHTML(key, base) {
  const added = new Set((edits[key] || {}).add || []);
  const cs = cardsOf(key, base);
  return cs.map((c) => `<span class="chip${added.has(c) && !(base || []).includes(c) ? " mine-chip" : ""}">${esc(DATA.card_names[c] || c)}${added.has(c) && !(base || []).includes(c) ? "（自分で確認）" : ""}</span>`).join("");
}
function editorHTML(key, base, opts = {}) {
  const cs = cardsOf(key, base);
  return `<details class="ed"><summary>カードを編集・消す</summary>
    <div class="ed-body" data-key="${esc(key)}" data-base="${esc((base || []).join(","))}">
      <div class="checks">${Object.entries(DATA.card_names).map(([k, v]) => `<label><input type="checkbox" value="${k}" ${cs.includes(k) ? "checked" : ""}> ${esc(v)}</label>`).join("")}</div>
      <div class="row"><button type="button" class="primary sm" data-ed-save>保存</button>
        ${opts.noHide ? "" : `<button type="button" class="link" data-ed-hide>リストから消す</button>`}
        <span class="small muted" data-ed-msg></span></div>
    </div></details>`;
}
async function saveEdit(key, patch) {
  const next = {...(edits[key] || {}), ...patch, updated_at: new Date().toISOString()};
  edits = {...edits, [key]: next};
  renderStores();
  if (editStore) {
    try { await editStore.doc(editKey(key)).set({...next, key}); return true; } catch (e) { editStore = null; }
  }
  try { localStorage.setItem(LS_EDITS, JSON.stringify(edits)); } catch (e) {}
  return !editStore;
}
const LS_KEY = "tcg-marks";
try { marks = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { marks = {}; }
async function initMarks() {
  try {
    const db = await window.claude?.use?.("db");
    if (!db) { $("marks-note").textContent = "応募記録はこの端末のブラウザに保存しています。"; return; }
    markStore = db.collection("marks");
    entryStore = db.collection("entries");
    editStore = db.collection("store_edits");
    editStore.onSnapshot((snap) => {
      const m = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.key) m[v.key] = v; });
      edits = m;
      renderStores();
    }, () => { editStore = null; });
    entryStore.onSnapshot((snap) => {
      entries = snap.docs.map((d) => ({...d.data(), _id: d.id})).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
      renderAll();
    }, () => { entryStore = null; });
    let settled = false;
    const timer = setTimeout(() => { if (!settled) $("marks-note").textContent = "応募記録の読み込みに時間がかかっています。"; }, 10000);
    markStore.onSnapshot((snap) => {
      if (!snap.metadata.fromCache) { settled = true; clearTimeout(timer); $("marks-note").textContent = ""; }
      const m = {}, mm = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.state) { m[d.id] = v.state; mm[d.id] = v; } });
      marks = m; markMeta = mm;
      renderList(); renderHistory();
    }, () => { settled = true; clearTimeout(timer); markStore = null; entryStore = null; $("marks-note").textContent = "応募記録を保存できないため、この端末のブラウザに保存しています。"; });
  } catch (e) { markStore = null; }
}
const LS_META = "tcg-marks-meta";
let markMeta = {};          // 応募ごとの控え（応募日・メモ・店と商品名）
try { markMeta = JSON.parse(localStorage.getItem(LS_META) || "{}"); } catch (e) { markMeta = {}; }
let histFilter = "";
let histDirty = false;
function snapOf(id) {
  const it = [...DATA.listings, ...entryListings()].find((x) => x.id === id);
  if (it) return {shop: it.shop, product_name: it.product_name, card_type: it.card_type, end_at: it.end_at || null, result_at: it.result_at || null, source_url: it.source_url || null};
  return (markMeta[id] && markMeta[id].snap) || null;
}
async function persistMark(id) {
  if (markStore) {
    try {
      if (marks[id]) await markStore.doc(id).set(markMeta[id]); else await markStore.doc(id).delete();
      return;
    } catch (e) { $("marks-note").textContent = "応募記録を保存できませんでした。この端末に保存します。"; markStore = null; }
  }
  try { localStorage.setItem(LS_KEY, JSON.stringify(marks)); localStorage.setItem(LS_META, JSON.stringify(markMeta)); } catch (e) {}
}
// 一覧では「応募済み」だけ押せる。当選・落選は応募履歴のページで記録する
async function setMark(id, state, hist) {
  const cur = marks[id];
  if (!hist && cur && cur !== "applied") return;
  let next = state;
  if (cur === state) next = hist ? "applied" : (state === "applied" ? null : "applied");
  const o = markMeta[id] || {};
  if (!next && o.memo) return;                       // メモがあるものは一覧から消さない（履歴から消す）
  const now = new Date().toISOString();
  if (next) {
    marks[id] = next;
    markMeta[id] = {...o, state: next, at: now, applied_at: o.applied_at || o.at || now, memo: o.memo || "", snap: snapOf(id)};
  } else { delete marks[id]; delete markMeta[id]; }
  renderList(); renderHistory();
  await persistMark(id);
}
async function setMemo(id, text) {
  if (!marks[id]) return;
  const o = markMeta[id] || {};
  markMeta[id] = {...o, state: marks[id], at: o.at || new Date().toISOString(), applied_at: o.applied_at || o.at || new Date().toISOString(), memo: String(text).slice(0, 500), snap: o.snap || snapOf(id)};
  await persistMark(id);
}
async function unmark(id) {
  delete marks[id]; delete markMeta[id];
  renderList(); renderHistory();
  await persistMark(id);
}

// ---- 自分で追加したものを一覧の形にそろえる ----
const MEMO_STALE = 3 * 24 * H;
function entryListings() {
  return entries.filter((e) => e.kind === "listing" || e.kind === "memo").map((e) => {
    const memo = e.kind === "memo";
    const seen = e.seen_at || e.created_at;
    return {
      id: "u-" + e._id, _entry: e._id, mine: memo ? "memo" : "listing",
      card_type: e.card_type, product_name: e.product || (memo ? "店頭メモ" : ""), shop: e.shop,
      sale_type: memo ? "store" : e.sale_type, status: memo ? "in_stock" : "open",
      start_at: memo ? null : e.start_at, end_at: memo ? null : e.end_at, result_at: memo ? null : (e.result_at || null), from_unv: e.from_unv != null, price: e.price || null, is_list_price: e.price ? null : undefined,
      pickup: memo ? "store" : (e.pickup || "store"), pickup_area: (memo || e.pickup !== "online") ? "宮崎県 " + e.shop : null,
      cities: e.city ? [e.city] : [], conditions: memo ? null : e.note, note: memo ? e.note : null,
      source_url: e.url, last_checked_at: seen, first_seen_at: e.created_at, needs_check: 0,
      memo_old: memo && NOW - new Date(seen) > MEMO_STALE,
    };
  });
}

// ---- 抽選・販売 ----
function filtered() {
  const card = $("f-card").value, type = $("f-type").value, pickup = $("f-pickup").value, city = $("f-city").value, showClosed = $("f-closed").checked;
  return [...DATA.listings, ...entryListings()].filter((it) => {
    if (card && it.card_type !== card) return false;
    if (type && it.sale_type !== type) return false;
    if (pickup && it.pickup !== pickup) return false;
    if (city && !(it.cities || []).includes(city)) return false;
    if (!showClosed && stateOf(it).key === "done") return false;
    if (!showClosed && it.memo_old) return false;
    return true;
  }).sort((a, b) => {
    // 新着（24時間以内）→ 締切が近い順
    const na = NOW - new Date(a.first_seen_at) < 24 * H, nb = NOW - new Date(b.first_seen_at) < 24 * H;
    const da = stateOf(a).key === "done", dbb = stateOf(b).key === "done";
    if (da !== dbb) return da ? 1 : -1;
    const ea = a.end_at ? new Date(a.end_at) : Infinity, eb = b.end_at ? new Date(b.end_at) : Infinity;
    if (ea !== eb) return ea - eb;
    return (nb ? 1 : 0) - (na ? 1 : 0);
  });
}

function itemHTML(it) {
  const st = it.mine === "memo" ? {key: "open", label: "店頭で確認"} : stateOf(it);
  const isNew = NOW - new Date(it.first_seen_at) < 24 * H;
  const price = it.price ? `${it.price.toLocaleString()}円` : "価格未確認";
  const lp = it.is_list_price === 1 ? "（定価）" : (it.is_list_price === null ? "（定価未確認）" : "");
  const period = [fmt(it.start_at), fmt(it.end_at)].some(Boolean) ? `${fmt(it.start_at) || "?"} 〜 ${fmt(it.end_at) || "未定"}` : "未定";
  const src = safeUrl(it.source_url), apply = safeUrl(it.apply_url);
  const m = marks[it.id];
  const MK = {applied: "応募済", won: "当選", lost: "落選"};
  const btn = (k, label) => `<button type="button" data-mark="${k}" data-id="${esc(it.id)}" aria-pressed="${!!m}">${label}</button>`;
  const P = it.end_at ? JPARTS(it.end_at) : null;
  const time = it.mine === "memo" ? `<div class="tm plain">${JPARTS(it.last_checked_at).hour}:${JPARTS(it.last_checked_at).minute}<small>${fmt(it.last_checked_at, false)}見た</small></div>`
    : P ? `<div class="tm">${P.hour}:${P.minute}<small>${P.month}/${P.day}(${P.weekday})</small></div>` : `<div class="tm plain">--:--<small>締切未定</small></div>`;
  const cd = it.end_at && st.key !== "done" && st.key !== "wait" ? `<small>${left(it.end_at)}</small>` : (st.key === "wait" && it.start_at ? `<small>${fmt(it.start_at, false)}〜</small>` : "");
  return `<details class="rw ${st.key === "done" ? "closed" : ""}">
    <summary>${time}
      <div class="wh"><b>${esc(it.shop)}</b><span class="p">${esc(it.product_name)} ・ ${price}</span>
        <span class="tags"><span class="tag">${esc(DATA.card_names[it.card_type] || it.card_type)}</span><span class="tag">${TYPE[it.sale_type] || ""}</span>
        ${isForm(it.source_url) || isForm(it.apply_url) ? '<span class="tag warn">Googleフォーム</span>' : ""}
        <span class="tag">${it.pickup === "store" ? "店頭受取" : "配送"}</span>
        ${it.result_at && st.key !== "done" ? `<span class="tag">発表 ${esc(fmtResult(it.result_at))}</span>` : (it.result_at && marks[it.id] === "applied" ? `<span class="tag">発表 ${esc(fmtResult(it.result_at))}</span>` : "")}
        ${isNew && !it.mine ? '<span class="tag new">新着</span>' : ""}
        ${it.mine ? `<span class="tag mine">${it.mine === "memo" ? "自分のメモ" : it.from_unv ? "未確認→自分で確認" : "自分で追加"}</span>` : ""}
        ${stale(it) ? '<span class="tag warn">要確認</span>' : ""}${it.memo_old ? '<span class="tag warn">古い情報</span>' : ""}
        ${m ? `<span class="mk">● ${MK[m]}</span>` : ""}</span></div>
      <div class="stt st-${st.key}">${st.label}${cd}</div>
    </summary>
    <div class="det">
      <dl>
        ${it.mine === "memo" ? "" : `<dt>受付</dt><dd class="mono">${period}</dd>`}
        ${it.result_at ? `<dt>当選発表</dt><dd class="mono">${esc(fmtResult(it.result_at))}</dd>` : ""}
        <dt>価格</dt><dd>${price}${lp}</dd>
        ${it.pickup === "store" && it.pickup_area ? `<dt>受取</dt><dd>${esc(it.pickup_area)}</dd>` : ""}
        ${it.conditions ? `<dt>条件</dt><dd>${esc(it.conditions)}</dd>` : ""}
        ${it.note ? `<dt>メモ</dt><dd>${esc(it.note)}</dd>` : ""}
        <dt>${it.mine === "memo" ? "見た日時" : it.mine ? "登録" : "最終確認"}</dt><dd class="mono">${fmt(it.last_checked_at)}（${ago(it.last_checked_at)}）</dd>
      </dl>
      ${it.verify_status && it.verify_status !== "ok" ? `<div class="note">${VERIFY[it.verify_status] || it.verify_status}${it.verify_note ? "：" + esc(it.verify_note) : ""}</div>` : ""}
      <div class="acts">
        ${src ? `<a href="${esc(src)}" target="_blank" rel="noopener">${isForm(src) ? "応募フォーム" : "一次情報"} ↗</a>` : ""}
        ${apply && apply !== src ? `<a href="${esc(apply)}" target="_blank" rel="noopener">応募ページ ↗</a>` : ""}
        <span class="marks">${btn("applied", "応募済み")}</span>${m ? `<a href="#hist" class="small">応募履歴で当落を記録</a>` : ""}
        ${it._entry ? `<button type="button" class="link" data-del="${esc(it._entry)}">削除</button>` : ""}
      </div>
    </div>
  </details>`;
}

function renderGroup(el, title, items, emptyText) {
  el.innerHTML = `<div class="ghead"><h2>${title}</h2><span class="count">${items.length}件</span></div>` +
    (items.length ? `<div class="cap"><span>締切</span><span>店・商品</span><span>状態</span></div><div class="board">${items.map(itemHTML).join("")}</div>` : `<div class="empty">${emptyText}</div>`);
}

// ---- 応募履歴（「応募済み」を押したものの当落とメモ） ----
function renderHistory() {
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains("mem")) { histDirty = true; return; }
  const all = [...DATA.listings, ...entryListings()];
  const ST = {applied: "結果待ち", won: "当選", lost: "落選"};
  const rows = Object.keys(marks).map((id) => {
    const meta = markMeta[id] || {};
    const it = all.find((x) => x.id === id) || meta.snap || {shop: "（店名不明）", product_name: ""};
    return {id, it, state: marks[id], meta, at: meta.applied_at || meta.at || ""};
  }).sort((a, b) => String(b.at).localeCompare(String(a.at)));
  const n = (k) => rows.filter((r) => r.state === k).length;
  const w = n("won"), l = n("lost");
  $("hist-sum").innerHTML = `<span><b>${rows.length}</b>応募</span><span><b>${n("applied")}</b>結果待ち</span><span><b>${w}</b>当選</span><span><b>${l}</b>落選</span>` + (w + l ? `<span>当選率 <b>${Math.round(100 * w / (w + l))}</b>%</span>` : "");
  const F = [["", "すべて"], ["applied", "結果待ち"], ["won", "当選"], ["lost", "落選"]];
  $("hist-filt").innerHTML = F.map(([k, v]) => `<button type="button" class="regbtn" data-hf="${k}" aria-pressed="${histFilter === k}">${v}</button>`).join("");
  const shown = rows.filter((r) => !histFilter || r.state === histFilter);
  const el = $("hist-list");
  el.innerHTML = `<div class="ghead"><h2>応募履歴</h2><span class="count">${shown.length}件</span></div>` + (shown.length ? `<div class="board">` + shown.map((r) => {
    const it = r.it, meta = r.meta;
    const res = it.result_at ? new Date(it.result_at) : null;
    const late = r.state === "applied" && res && res < NOW;
    const src = safeUrl(it.source_url);
    const btn = (k) => `<button type="button" data-mark="${k}" data-hist="1" data-id="${esc(r.id)}" aria-pressed="${r.state === k}">${ST[k]}</button>`;
    return `<div class="hrow ${r.state}">
      <div class="hh"><b>${esc(it.shop)}</b><span class="p">${esc(it.product_name)}${it.card_type ? " ・ " + esc(DATA.card_names[it.card_type] || it.card_type) : ""}</span>
        <span class="p">${r.at ? "応募 " + fmt(r.at, false) : "応募日不明"}${res ? ` ・ <span class="${late ? "late" : ""}">当選発表 ${esc(fmtResult(it.result_at))}${late ? "（過ぎています。結果を記録してください）" : ""}</span>` : (r.state === "applied" ? " ・ 発表日は未確認" : "")}</span></div>
      <span class="marks">${btn("applied")}${btn("won")}${btn("lost")}</span>
      <textarea class="mem" rows="2" maxlength="500" data-memo="${esc(r.id)}" placeholder="メモ（受け取り方、いつ連絡が来たか など）" aria-label="メモ">${esc(meta.memo || "")}</textarea>
      <div class="hacts">${src ? `<a href="${esc(src)}" target="_blank" rel="noopener">告知 ↗</a>` : ""}<button type="button" class="link" data-unmark="${esc(r.id)}">履歴から消す</button></div>
    </div>`;
  }).join("") + "</div>" : `<div class="empty">${rows.length ? "この条件の履歴はありません。" : "まだ応募履歴はありません。「締切」タブで抽選を開き、応募したら「応募済み」を押してください。"}</div>`);
}

function renderList() {
  const rows = filtered();
  const pickup = $("f-pickup").value;
  $("g-store").hidden = pickup === "online";
  $("g-online").hidden = pickup === "store" || !!$("f-city").value;
  renderGroup($("g-store"), "宮崎県内の店", rows.filter((r) => r.pickup === "store"),
    "いま一次情報で確認できた県内の店の抽選はありません。「未確認」タブに、裏が取れていない県内の情報があります。");

async function confirmUnv(box) {

async function onEditorClick(e) {
  const body = e.target.closest(".ed-body");
  const r = e.target.closest("[data-restore]");
  if (r) { await saveEdit(r.dataset.restore, {hidden: false}); return; }
  if (!body) return;
  const key = body.dataset.key, base = body.dataset.base ? body.dataset.base.split(",") : [];
  const msg = body.querySelector("[data-ed-msg]");
  if (e.target.closest("[data-ed-save]")) {
    const checked = [...body.querySelectorAll("input:checked")].map((c) => c.value);
    if (key.startsWith("e:")) {               // 自分で追加した店は、その登録自体を書き換える
      const id = key.slice(2);
      try {
        if (entryStore && !id.startsWith("local-")) await entryStore.doc(id).update({card_types: checked});
        else { entries = entries.map((x) => x._id === id ? {...x, card_types: checked} : x); try { localStorage.setItem(LS_ENTRIES, JSON.stringify(entries)); } catch (er) {} renderAll(); }
      } catch (er) { msg.textContent = "保存できませんでした。"; }
      return;
    }
    const add = checked.filter((c) => !base.includes(c)), remove = base.filter((c) => !checked.includes(c));
    msg.textContent = "保存中…";
    await saveEdit(key, {add, remove});
  }
  const h = e.target.closest("[data-ed-hide]");
  if (h) {
    if (h.dataset.confirm !== "1") { h.dataset.confirm = "1"; h.textContent = "本当に消す（あとで戻せます）"; setTimeout(() => { h.dataset.confirm = ""; h.textContent = "リストから消す"; }, 4000); return; }
    await saveEdit(key, {hidden: true});
  }
}

    if (kind === "memo" && !v("a-product") && !v("a-note")) { msg.textContent = "商品名かメモのどちらかを入れてください。"; return; }
    if (v("a-url") && !safeUrl(v("a-url"))) { msg.textContent = "URLは https:// から始まる形で入れてください。"; $("a-url").focus(); return; }

    }

      if (entryStore) { await entryStore.add(doc); msg.textContent = "追加しました。"; }

        entries = [{...doc, _id: "local-" + Date.now()}, ...entries];

        renderAll();
      }
      ["a-shop", "a-city", "a-product", "a-start", "a-end", "a-price", "a-seen", "a-url", "a-note"].forEach((id) => { $(id).value = ""; });
      document.querySelectorAll("#a-cards input").forEach((c) => { c.checked = false; });
    } catch (e) {
      msg.textContent = e && e.code === "quota_exceeded" ? "保存できる件数の上限です。古い登録を削除してください。" : "保存できませんでした。通信を確認してもう一度押してください。";
    } finally { $("a-submit").disabled = false; }
  });
}
async function deleteEntry(id, btn) {
  if (btn.dataset.confirm !== "1") { btn.dataset.confirm = "1"; btn.textContent = "本当に削除"; setTimeout(() => { btn.dataset.confirm = ""; btn.textContent = "削除"; }, 4000); return; }
  if (entryStore && !id.startsWith("local-")) {
    try { await entryStore.doc(id).delete(); } catch (e) { btn.textContent = "削除できませんでした"; }
  } else {
    entries = entries.filter((e) => e._id !== id);
    try { localStorage.setItem(LS_ENTRIES, JSON.stringify(entries)); } catch (e) {}
    renderAll();
  }
}
function renderMyEntries() {
  const K = {store: "店", listing: "抽選・販売", memo: "店頭メモ"};
  $("my-entries").innerHTML = `<div class="ghead"><h2>追加したもの</h2><span class="count">${entries.length}件</span></div>` +
    (entries.length ? '<div class="panel">' + entries.map((e) => `
      <div class="store"><div class="row"><span class="tag">${K[e.kind] || ""}</span><span class="nm">${esc(e.shop)}</span>${e.product ? `<span class="small">${esc(e.product)}</span>` : ""}
        ${e.imported ? '<span class="pill st-ok">収集に反映済み</span>' : ""}
        <button type="button" class="link" data-del="${esc(e._id)}" style="margin-left:auto">削除</button></div>
        <div class="small muted">登録 ${fmt(e.created_at)}${e.note ? " ・ " + esc(e.note) : ""}</div></div>`).join("") + "</div>"
      : '<div class="empty">まだ何も追加していません。</div>');
}

function setupFilters() {
  const cards = [...new Set([...DATA.listings, ...(DATA.products || [])].map((l) => l.card_type).concat(...(DATA.shops_online || []).map((s) => s.card_types)))];
  $("f-card").innerHTML = '<option value="">カード：すべて</option>' + Object.entries(DATA.card_names).map(([k, v]) => `<option value="${k}" ${cards.includes(k) ? "" : "disabled"}>${esc(v)}</option>`).join("");
  const cities = [...new Set(DATA.stores.map((s) => s.city))];
  $("f-city").innerHTML = '<option value="">市町村：すべて</option>' + cities.map((c) => `<option>${esc(c)}</option>`).join("");
  ["f-card", "f-type", "f-pickup", "f-city", "f-closed"].forEach((id) => $(id).addEventListener("change", () => { renderList(); renderStores(); saveUi(); }));
  try {
    const ui = JSON.parse(localStorage.getItem("tcg-ui") || "{}");
    ["f-card", "f-type", "f-pickup", "f-city"].forEach((id) => { if (ui[id] != null) $(id).value = ui[id]; });
  } catch (e) {}
}
function saveUi() {
  try { localStorage.setItem("tcg-ui", JSON.stringify(Object.fromEntries(["f-card", "f-type", "f-pickup", "f-city"].map((id) => [id, $(id).value])))); } catch (e) {}
}

const VIEWS = ["list", "hist", "unv", "stores", "add", "log"];
function show(view) {
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  VIEWS.forEach((v) => { $("view-" + v).hidden = v !== view; });
}
document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => { show(b.dataset.view); if (location.hash !== "#" + b.dataset.view) history.replaceState(null, "", "#" + b.dataset.view); }));
document.addEventListener("click", (e) => {
  const rb = e.target.closest("button[data-region]");
  if (rb) { storeRegion = storeRegion === rb.dataset.region ? "" : rb.dataset.region; renderStores(); return; }
  if (e.target.closest("button[data-famima]")) {
    const r = document.querySelector('input[name="kind"][value="memo"]'); r.checked = true; r.dispatchEvent(new Event("change"));
    $("a-card").value = "topps"; $("a-shop").value = e.target.closest("button[data-famima]").dataset.famima || "ファミリーマート "; if (!$("a-product").value) $("a-product").value = "Topps野球カード";
    show("add"); history.replaceState(null, "", "#add"); $("a-shop").focus();
    const n = $("a-shop").value.length; try { $("a-shop").setSelectionRange(n, n); } catch (er) {}
    return;
  }
  const uo = e.target.closest("button[data-unv-ok]");
  if (uo) { confirmUnv(uo.closest(".unv-form")); return; }
  const hf = e.target.closest("button[data-hf]");
  if (hf) { histFilter = hf.dataset.hf; renderHistory(); return; }
  const um = e.target.closest("button[data-unmark]");
  if (um) {
    if (um.dataset.confirm !== "1") { um.dataset.confirm = "1"; um.textContent = "本当に消す"; setTimeout(() => { um.dataset.confirm = ""; um.textContent = "履歴から消す"; }, 4000); return; }
    unmark(um.dataset.unmark); return;
  }
  const b = e.target.closest("button[data-mark]"); if (b) setMark(b.dataset.id, b.dataset.mark, !!b.dataset.hist);
  const d = e.target.closest("button[data-del]"); if (d) deleteEntry(d.dataset.del, d);
});
document.addEventListener("change", (e) => { const t = e.target.closest && e.target.closest("textarea[data-memo]"); if (t) setMemo(t.dataset.memo, t.value); });
document.addEventListener("focusout", (e) => { if (histDirty && e.target.classList && e.target.classList.contains("mem")) { histDirty = false; setTimeout(renderHistory, 0); } });
window.addEventListener("hashchange", () => show((location.hash || "#list").slice(1)));

setupFilters();
setupForm();
renderAll(); renderUnv(); renderLog();
if (VIEWS.includes(location.hash.slice(1))) show(location.hash.slice(1));
initMarks();
</script>
