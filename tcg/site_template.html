<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 1カラムの「抽選帳」。上に今日の要点、下に締切順のカード。スマホ優先 */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#18212b; --muted:#5d6a78; --line:#dde3ea;
  --accent:#0f6f7a; --accent-soft:#e2f1f2;
  --open:#1d7a46; --open-soft:#e3f3e9; --soon:#b4321f; --soon-soft:#fbe7e3;
  --wait:#5b55a8; --wait-soft:#ebeaf8; --done:#7b8592; --done-soft:#eceff2;
  --warn:#9a6400; --warn-soft:#fbf0d9;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --surface:#18212a; --ink:#e6ebf0; --muted:#97a4b2; --line:#2a3541;
  --accent:#5cc3cc; --accent-soft:#163a3e;
  --open:#62c88d; --open-soft:#173327; --soon:#ff8a73; --soon-soft:#3d1f1a;
  --wait:#a9a3f2; --wait-soft:#25233f; --done:#8a96a3; --done-soft:#222b34;
  --warn:#f0b94f; --warn-soft:#3a2d12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --ink:#e6ebf0; --muted:#97a4b2; --line:#2a3541;
  --accent:#5cc3cc; --accent-soft:#163a3e;
  --open:#62c88d; --open-soft:#173327; --soon:#ff8a73; --soon-soft:#3d1f1a;
  --wait:#a9a3f2; --wait-soft:#25233f; --done:#8a96a3; --done-soft:#222b34;
  --warn:#f0b94f; --warn-soft:#3a2d12; color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;width:100%;min-width:0;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.group,.panel,.tablewrap{min-width:0;max-width:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:26px;font-weight:900;letter-spacing:.02em}
h2{font-size:18px;font-weight:700}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
header{display:flex;flex-direction:column;gap:10px}
.sub{color:var(--muted);font-size:13px}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.today div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.today b{font-family:var(--f-mono);font-size:24px;line-height:1.1}
.today span{font-size:12px;color:var(--muted)}
.today .hot b{color:var(--soon)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{font:inherit;font-weight:700;font-size:14px;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters label{font:inherit;font-size:13px}
.filters select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.filters label{display:flex;align-items:center;gap:4px;color:var(--muted)}
section.group{display:flex;flex-direction:column;gap:10px}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.group-head .count{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:14px}
article.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
article.item.closed{opacity:.62}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.st-open{background:var(--open-soft);color:var(--open)}
.st-soon{background:var(--soon-soft);color:var(--soon)}
.st-wait{background:var(--wait-soft);color:var(--wait)}
.st-done{background:var(--done-soft);color:var(--done)}
.st-warn{background:var(--warn-soft);color:var(--warn)}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.prod{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.shop{font-weight:700}
.deadline{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.deadline.hot{color:var(--soon);font-weight:700}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13.5px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
details.cond summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.cond p{margin:6px 0 0;font-size:13.5px;overflow-wrap:anywhere}
.foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.foot a{font-weight:700}
.marks{display:flex;gap:4px;margin-left:auto}
.marks button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:6px;padding:2px 8px;cursor:pointer}
.marks button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.note{font-size:12.5px;color:var(--warn)}
.unv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.city{display:flex;flex-direction:column;gap:6px}
.store{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.store:last-child{border-bottom:0}
.store .nm{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;border-radius:4px;padding:0 6px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;font-size:13px;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;white-space:nowrap}
.dbnote{font-size:12px;color:var(--muted)}
.upc{display:flex;flex-direction:column;gap:8px}
.upc-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.upc-date{grid-row:span 3;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;border-radius:8px;background:var(--accent-soft);color:var(--accent);padding:6px 4px;text-align:center;line-height:1.2}
.upc-date b{font-family:var(--f-mono);font-size:17px}
.upc-date span{font-size:11px}
.upc-name{font-weight:700;overflow-wrap:anywhere;line-height:1.45}
.form{display:flex;flex-direction:column;gap:12px}
.form label,.form .lbl,.form legend{font-size:13px;color:var(--muted);font-weight:500}
.form input,.form select,.form textarea{font:inherit;font-size:16px;width:100%;box-sizing:border-box;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field.two>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.seg{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.seg legend{width:100%;margin-bottom:4px}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--ink);font-size:14px;cursor:pointer}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.seg input{width:auto;accent-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;align-items:center;gap:4px;color:var(--ink);font-size:14px;border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.checks input{width:auto;accent-color:var(--accent)}
button.primary{font:inherit;font-weight:700;background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button.primary:disabled{opacity:.5;cursor:default}
button.link{font:inherit;font-size:12.5px;background:none;border:0;color:var(--soon);cursor:pointer;padding:0}
.mine{background:var(--wait-soft);color:var(--wait)}
.st-ok{background:var(--open-soft);color:var(--open)}
@media (max-width:480px){.today b{font-size:20px}.deadline{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>宮崎トレカ抽選帳</h1>
    <div class="sub">自分専用。宮崎県内の店と、全国から応募できる通販・アプリ抽選。<span id="built"></span></div>
    <div class="today" id="today"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-list" aria-selected="true" data-view="list">抽選・販売</button>
    <button role="tab" id="tab-unv" aria-selected="false" data-view="unv">未確認 <span id="unv-n"></span></button>
    <button role="tab" id="tab-stores" aria-selected="false" data-view="stores">店リスト</button>
    <button role="tab" id="tab-add" aria-selected="false" data-view="add">＋ 追加する</button>
    <button role="tab" id="tab-log" aria-selected="false" data-view="log">更新記録</button>
  </nav>

  <div id="view-list" class="wrap" style="gap:16px">
    <div class="filters">
      <select id="f-card" aria-label="カード種"></select>
      <select id="f-type" aria-label="販売方法">
        <option value="">販売方法：すべて</option><option value="lottery">抽選</option><option value="first_come">先着</option><option value="restock">再販</option><option value="store">店頭</option>
      </select>
      <select id="f-pickup" aria-label="受取方法">
        <option value="">受取：すべて</option><option value="store">宮崎の店で受取</option><option value="online">配送</option>
      </select>
      <select id="f-city" aria-label="市町村"></select>
      <label><input type="checkbox" id="f-closed"> 終了も表示</label>
    </div>
    <section class="group" id="g-store"></section>
    <section class="group" id="g-online"></section>
    <section class="group" id="g-upcoming"></section>
    <p class="dbnote" id="marks-note"></p>
  </div>

  <div id="view-unv" class="wrap" hidden style="gap:10px">
    <p class="muted small" style="margin:0">一次情報（店の公式ページ）で裏が取れていない情報です。一覧には載せていません。気になるものは自分で店の告知を確認してください。</p>
    <div id="unv-list" class="wrap" style="gap:8px"></div>
  </div>

  <div id="view-stores" class="wrap" hidden style="gap:14px">
    <p class="muted small" style="margin:0" id="stores-head"></p>
    <section class="group" id="my-stores"></section>
    <section class="group" id="online-shops"></section>
    <h2>宮崎県内の店</h2>
    <div id="stores-list" class="wrap" style="gap:14px"></div>
    <div class="panel">
      <h2 style="font-size:15px;margin-bottom:8px">チェーンの県内店舗の確認状況</h2>
      <div class="tablewrap"><table id="chains"></table></div>
    </div>
  </div>

  <div id="view-add" class="wrap" hidden style="gap:14px">
    <p class="muted small" style="margin:0">自分で見つけた店や抽選、店頭で見た在庫を登録できます。登録した内容はすぐ一覧に出て、次の定期収集で一次情報の確認もします。</p>
    <form id="add-form" class="panel form" novalidate>
      <fieldset class="seg" id="add-kind">
        <legend>何を追加しますか</legend>
        <label><input type="radio" name="kind" value="store" checked> 店</label>
        <label><input type="radio" name="kind" value="listing"> 抽選・販売</label>
        <label><input type="radio" name="kind" value="memo"> 店頭メモ</label>
      </fieldset>
      <div class="field" data-for="store listing memo"><label for="a-shop">店・サイトの名前</label><input id="a-shop" required placeholder="例：カードショップ○○ 宮崎店"></div>
      <div class="field" data-for="store"><label for="a-where">場所</label>
        <select id="a-where"><option value="miyazaki">宮崎県内の実店舗</option><option value="online">通販・全国</option></select></div>
      <div class="field" data-for="store"><label for="a-city">市町村</label><input id="a-city" list="city-list" placeholder="例：宮崎市"><datalist id="city-list"></datalist></div>
      <div class="field" data-for="store"><span class="lbl">扱っているカード</span><div class="checks" id="a-cards"></div></div>
      <div class="field" data-for="listing memo"><label for="a-card">カード</label><select id="a-card"></select></div>
      <div class="field" data-for="listing memo"><label for="a-product">商品名</label><input id="a-product" placeholder="例：神の支配【OP-18】BOX"></div>
      <div class="field" data-for="listing"><label for="a-type">販売方法</label>
        <select id="a-type"><option value="lottery">抽選</option><option value="first_come">先着</option><option value="restock">再販</option><option value="store">店頭販売</option></select></div>
      <div class="field" data-for="listing"><label for="a-pickup">受取</label>
        <select id="a-pickup"><option value="store">宮崎の店で受取</option><option value="online">配送</option></select></div>
      <div class="field two" data-for="listing"><div><label for="a-start">受付開始</label><input id="a-start" type="datetime-local"></div><div><label for="a-end">締切</label><input id="a-end" type="datetime-local"></div></div>
      <div class="field" data-for="listing"><label for="a-price">価格（税込・円）</label><input id="a-price" type="number" inputmode="numeric" min="0" placeholder="例：5760"></div>
      <div class="field" data-for="memo"><label for="a-seen">見た日時</label><input id="a-seen" type="datetime-local"></div>
      <div class="field" data-for="store listing memo"><label for="a-url">URL（公式ページ・告知。あれば）</label><input id="a-url" type="url" inputmode="url" placeholder="https://"></div>
      <div class="field" data-for="store listing memo"><label for="a-note">メモ（応募条件・在庫の様子など）</label><textarea id="a-note" rows="3"></textarea></div>
      <div class="row"><button type="submit" class="primary" id="a-submit">追加する</button><span class="small muted" id="a-msg" role="status"></span></div>
    </form>
    <section class="group" id="my-entries"></section>
  </div>

  <div id="view-log" class="wrap" hidden style="gap:10px">
    <div class="panel tablewrap"><table id="runs"></table></div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = (u) => /^https?:\/\//.test(u || "") ? u : null;
const NOW = new Date();
const H = 3600e3;
const TYPE = {lottery:"抽選", first_come:"先着", restock:"再販", store:"店頭"};
const VERIFY = {ok:"一次情報と一致", mismatch:"要目視（自動照合で一致せず）", blocked:"自動確認不可", unreachable:"開けなかった"};

// 表示は常に日本時間
const JST_PARTS = new Intl.DateTimeFormat("ja-JP", {timeZone: "Asia/Tokyo", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23"});
function fmt(s, withTime = true) {
  if (!s) return null;
  const p = Object.fromEntries(JST_PARTS.formatToParts(new Date(s)).map((x) => [x.type, x.value]));
  const md = `${p.month}/${p.day}(${p.weekday})`;
  return withTime ? `${md} ${p.hour}:${p.minute}` : md;
}
function ago(s) {
  const m = Math.round((NOW - new Date(s)) / 60000);
  if (m < 60) return `${Math.max(m, 0)}分前`;
  if (m < 48 * 60) return `${Math.round(m / 60)}時間前`;
  return `${Math.round(m / 1440)}日前`;
}
function left(s) {
  const ms = new Date(s) - NOW;
  if (ms <= 0) return "締切済み";
  const h = ms / H;
  if (h < 1) return `あと${Math.ceil(ms / 60000)}分`;
  if (h < 48) return `あと${Math.floor(h)}時間`;
  return `あと${Math.floor(h / 24)}日`;
}

// 状態をいまの時刻で計算し直す（受付中／まもなく締切／受付前／終了／要確認）
function stateOf(it) {
  const end = it.end_at ? new Date(it.end_at) : null;
  const start = it.start_at ? new Date(it.start_at) : null;
  if (it.status === "closed" || (end && end < NOW)) return {key: "done", label: "終了"};
  if (it.status === "sold_out") return {key: "done", label: "売り切れ"};
  if (it.status === "in_stock") return {key: "open", label: "販売中"};
  if (start && start > NOW) return {key: "wait", label: "受付前"};
  if (end && end - NOW < 48 * H) return {key: "soon", label: "まもなく締切"};
  if (it.status === "unknown") return {key: "warn", label: "状態不明"};
  return {key: "open", label: "受付中"};
}
function stale(it) {
  if (it.needs_check) return true;
  const age = NOW - new Date(it.last_checked_at);
  if (it.status === "in_stock" && it.pickup === "online") return age > 0.5 * H;
  if (["upcoming", "open", "in_stock"].includes(it.status)) return age > 24 * H;
  return false;
}

// ---- 応募記録（claude.ai のデータ保存。使えないときはこの端末だけに保存） ----
let marks = {};
let entries = [];          // 自分で追加した店・抽選・メモ
let entryStore = null;
const LS_ENTRIES = "tcg-entries";
try { entries = JSON.parse(localStorage.getItem(LS_ENTRIES) || "[]"); } catch (e) { entries = []; }
let markStore = null;
const LS_KEY = "tcg-marks";
try { marks = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { marks = {}; }
async function initMarks() {
  try {
    const db = await window.claude?.use?.("db");
    if (!db) { $("marks-note").textContent = "応募記録はこの端末のブラウザに保存しています。"; return; }
    markStore = db.collection("marks");
    entryStore = db.collection("entries");
    entryStore.onSnapshot((snap) => {
      entries = snap.docs.map((d) => ({...d.data(), _id: d.id})).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
      renderAll();
    }, () => { entryStore = null; });
    let settled = false;
    const timer = setTimeout(() => { if (!settled) $("marks-note").textContent = "応募記録の読み込みに時間がかかっています。"; }, 10000);
    markStore.onSnapshot((snap) => {
      if (!snap.metadata.fromCache) { settled = true; clearTimeout(timer); $("marks-note").textContent = ""; }
      const m = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.state) m[d.id] = v.state; });
      marks = m;
      renderList();
    }, () => { settled = true; clearTimeout(timer); markStore = null; entryStore = null; $("marks-note").textContent = "応募記録を保存できないため、この端末のブラウザに保存しています。"; });
  } catch (e) { markStore = null; }
}
async function setMark(id, state) {
  const next = marks[id] === state ? null : state;
  if (next) marks[id] = next; else delete marks[id];
  renderList();
  if (markStore) {
    try {
      if (next) await markStore.doc(id).set({state: next, at: new Date().toISOString()});
      else await markStore.doc(id).delete();
      return;
    } catch (e) { $("marks-note").textContent = "応募記録を保存できませんでした。この端末に保存します。"; markStore = null; }
  }
  try { localStorage.setItem(LS_KEY, JSON.stringify(marks)); } catch (e) {}
}

// ---- 自分で追加したものを一覧の形にそろえる ----
const MEMO_STALE = 3 * 24 * H;
function entryListings() {
  return entries.filter((e) => e.kind === "listing" || e.kind === "memo").map((e) => {
    const memo = e.kind === "memo";
    const seen = e.seen_at || e.created_at;
    return {
      id: "u-" + e._id, _entry: e._id, mine: memo ? "memo" : "listing",
      card_type: e.card_type, product_name: e.product || (memo ? "店頭メモ" : ""), shop: e.shop,
      sale_type: memo ? "store" : e.sale_type, status: memo ? "in_stock" : "open",
      start_at: memo ? null : e.start_at, end_at: memo ? null : e.end_at, price: e.price || null, is_list_price: e.price ? null : undefined,
      pickup: memo ? "store" : (e.pickup || "store"), pickup_area: (memo || e.pickup !== "online") ? "宮崎県 " + e.shop : null,
      cities: e.city ? [e.city] : [], conditions: memo ? null : e.note, note: memo ? e.note : null,
      source_url: e.url, last_checked_at: seen, first_seen_at: e.created_at, needs_check: 0,
      memo_old: memo && NOW - new Date(seen) > MEMO_STALE,
    };
  });
}

// ---- 抽選・販売 ----
function filtered() {
  const card = $("f-card").value, type = $("f-type").value, pickup = $("f-pickup").value, city = $("f-city").value, showClosed = $("f-closed").checked;
  return [...DATA.listings, ...entryListings()].filter((it) => {
    if (card && it.card_type !== card) return false;
    if (type && it.sale_type !== type) return false;
    if (pickup && it.pickup !== pickup) return false;
    if (city && !(it.cities || []).includes(city)) return false;
    if (!showClosed && stateOf(it).key === "done") return false;
    if (!showClosed && it.memo_old) return false;
    return true;
  }).sort((a, b) => {
    // 新着（24時間以内）→ 締切が近い順
    const na = NOW - new Date(a.first_seen_at) < 24 * H, nb = NOW - new Date(b.first_seen_at) < 24 * H;
    const da = stateOf(a).key === "done", dbb = stateOf(b).key === "done";
    if (da !== dbb) return da ? 1 : -1;
    const ea = a.end_at ? new Date(a.end_at) : Infinity, eb = b.end_at ? new Date(b.end_at) : Infinity;
    if (ea !== eb) return ea - eb;
    return (nb ? 1 : 0) - (na ? 1 : 0);
  });
}

function setupForm() {
  const cards = Object.entries(DATA.card_names);
  $("a-cards").innerHTML = cards.map(([k, v]) => `<label><input type="checkbox" value="${k}"> ${esc(v)}</label>`).join("");
  $("a-card").innerHTML = cards.map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("");
  $("city-list").innerHTML = [...new Set(DATA.stores.map((s) => s.city))].map((c) => `<option value="${esc(c)}">`).join("");
  const sync = () => {
    const kind = document.querySelector('input[name="kind"]:checked').value;
    document.querySelectorAll("#add-form .field").forEach((f) => { f.hidden = !f.dataset.for.split(" ").includes(kind); });
    $("a-city").closest(".field").hidden = kind !== "store" || $("a-where").value !== "miyazaki";
    $("a-submit").textContent = {store: "店を追加する", listing: "抽選・販売を追加する", memo: "メモを残す"}[kind];
  };
  document.querySelectorAll('input[name="kind"]').forEach((r) => r.addEventListener("change", sync));
  $("a-where").addEventListener("change", sync);
  sync();
  $("add-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const kind = document.querySelector('input[name="kind"]:checked').value;
    const v = (id) => $(id).value.trim();
    const toIso = (s) => s ? new Date(s).toISOString() : null;   // datetime-local は端末の時刻帯（日本時間）として読む
    const msg = $("a-msg");
    if (!v("a-shop")) { msg.textContent = "店・サイトの名前を入れてください。"; $("a-shop").focus(); return; }
    if (kind === "listing" && !v("a-product")) { msg.textContent = "商品名を入れてください。"; $("a-product").focus(); return; }
    if (kind === "memo" && !v("a-product") && !v("a-note")) { msg.textContent = "商品名かメモのどちらかを入れてください。"; return; }
    if (v("a-url") && !safeUrl(v("a-url"))) { msg.textContent = "URLは https:// から始まる形で入れてください。"; $("a-url").focus(); return; }
    const doc = {kind, shop: v("a-shop"), url: v("a-url") || null, note: v("a-note") || null, created_at: new Date().toISOString(), imported: false};
    if (kind === "store") {
      doc.where = $("a-where").value; doc.city = doc.where === "miyazaki" ? (v("a-city") || null) : null;
      doc.card_types = [...document.querySelectorAll("#a-cards input:checked")].map((c) => c.value);
    } else {
      doc.card_type = $("a-card").value; doc.product = v("a-product") || null;
    }
    if (kind === "listing") {
      Object.assign(doc, {sale_type: $("a-type").value, pickup: $("a-pickup").value, start_at: toIso(v("a-start")), end_at: toIso(v("a-end")), price: v("a-price") ? Number(v("a-price")) : null});
    }
    if (kind === "memo") doc.seen_at = toIso(v("a-seen")) || doc.created_at;
    $("a-submit").disabled = true;
    try {
      if (entryStore) { await entryStore.add(doc); msg.textContent = "追加しました。"; }
      else {
        entries = [{...doc, _id: "local-" + Date.now()}, ...entries];
        try { localStorage.setItem(LS_ENTRIES, JSON.stringify(entries)); } catch (e) {}
        msg.textContent = "この端末に保存しました（定期収集には届きません）。";
        renderAll();
      }
      ["a-shop", "a-city", "a-product", "a-start", "a-end", "a-price", "a-seen", "a-url", "a-note"].forEach((id) => { $(id).value = ""; });
      document.querySelectorAll("#a-cards input").forEach((c) => { c.checked = false; });
    } catch (e) {
      msg.textContent = e && e.code === "quota_exceeded" ? "保存できる件数の上限です。古い登録を削除してください。" : "保存できませんでした。通信を確認してもう一度押してください。";
    } finally { $("a-submit").disabled = false; }
  });
}
async function deleteEntry(id, btn) {
  if (btn.dataset.confirm !== "1") { btn.dataset.confirm = "1"; btn.textContent = "本当に削除"; setTimeout(() => { btn.dataset.confirm = ""; btn.textContent = "削除"; }, 4000); return; }
  if (entryStore && !id.startsWith("local-")) {
    try { await entryStore.doc(id).delete(); } catch (e) { btn.textContent = "削除できませんでした"; }
  } else {
    entries = entries.filter((e) => e._id !== id);
    try { localStorage.setItem(LS_ENTRIES, JSON.stringify(entries)); } catch (e) {}
    renderAll();
  }
}

function saveUi() {
  try { localStorage.setItem("tcg-ui", JSON.stringify(Object.fromEntries(["f-card", "f-type", "f-pickup", "f-city"].map((id) => [id, $(id).value])))); } catch (e) {}
}

const VIEWS = ["list", "unv", "stores", "add", "log"];
function show(view) {
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === view)));
  VIEWS.forEach((v) => { $("view-" + v).hidden = v !== view; });
}
document.querySelectorAll("nav.tabs button").forEach((b) => b.addEventListener("click", () => { show(b.dataset.view); if (location.hash !== "#" + b.dataset.view) history.replaceState(null, "", "#" + b.dataset.view); }));
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-mark]"); if (b) setMark(b.dataset.id, b.dataset.mark);
  const d = e.target.closest("button[data-del]"); if (d) deleteEntry(d.dataset.del, d);
});
window.addEventListener("hashchange", () => show((location.hash || "#list").slice(1)));

setupFilters();
setupForm();
renderAll(); renderUnv(); renderLog();
if (VIEWS.includes(location.hash.slice(1))) show(location.hash.slice(1));
initMarks();
</script>
